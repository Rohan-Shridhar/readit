<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>readit</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>

<body>
    <main class="popup-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <img class="brand-icon" src="../icons/icon64.png" alt="readit logo">
                <div class="brand-info">
                    <h1>readit</h1>
                    <span class="badge" id="statusBadge">Ready</span>
                </div>
            </div>
        </header>

        <!-- Error / Notification Banner -->
        <div id="errorAlert" class="error-alert hidden" role="alert">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="errorMessage" class="error-text">Notice</span>
        </div>

        <!-- Progress and Selection Info -->
        <section id="selectionInfo" class="selection-info hidden" aria-live="polite">
            <div class="info-row">
                <span class="info-label" id="progressStatusLabel">Progress</span>
                <span id="wordProgressLabel" class="info-value">0 / 0 words</span>
            </div>
            <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <p id="previewSnippet" class="preview-snippet"></p>
        </section>

        <!-- Primary Actions (Idle / Selected) -->
        <section id="initialActions" class="action-section">
            <div class="action-buttons-group">
                <button id="mainActionBtn" class="primary-button" aria-label="Select Text or Start Reading">
                    <svg id="mainActionIcon" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span id="mainActionText">Select Text</span>
                </button>
                <button id="clearSelectionBtn" class="icon-secondary-button hidden" title="Clear selection">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Active Reading Controls (Reading / Paused) -->
        <section id="readingControls" class="reading-controls-section hidden">
            <div class="controls-row">
                <button id="prevBtn" class="control-btn" title="Previous Word (←)" aria-label="Previous Word">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <button id="pauseResumeBtn" class="control-btn primary-control-btn" title="Pause / Resume (Space)" aria-label="Pause or Resume">
                    <svg id="pauseResumeIcon" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    <span id="pauseResumeText">Pause</span>
                </button>
                <button id="nextBtn" class="control-btn" title="Next Word (→)" aria-label="Next Word">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
                <button id="stopBtn" class="control-btn stop-control-btn" title="Stop Reading (Esc)" aria-label="Stop Reading">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="5" y="5" width="14" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Preferences & Customization -->
        <section class="settings-section">
            <!-- Speed Control -->
            <div class="settings-header">
                <label for="speedRange" class="settings-label">Reading Speed</label>
                <span id="speedDisplay" class="settings-value">250 WPM</span>
            </div>
            <input type="range" id="speedRange" min="100" max="700" step="25" value="250" class="speed-slider" aria-label="Reading Speed">
            <div class="speed-presets">
                <button class="preset-pill" data-speed="175">175</button>
                <button class="preset-pill active" data-speed="250">250</button>
                <button class="preset-pill" data-speed="350">350</button>
                <button class="preset-pill" data-speed="500">500</button>
            </div>

            <!-- Highlight Theme Selection -->
            <div class="settings-divider"></div>
            <div class="settings-header">
                <span class="settings-label">Highlight Color</span>
            </div>
            <div class="theme-selector" id="themeSelector">
                <button class="theme-swatch swatch-yellow active" data-theme="yellow" title="Sun Yellow" aria-label="Yellow Theme"></button>
                <button class="theme-swatch swatch-green" data-theme="green" title="Emerald Green" aria-label="Green Theme"></button>
                <button class="theme-swatch swatch-cyan" data-theme="cyan" title="Electric Cyan" aria-label="Cyan Theme"></button>
                <button class="theme-swatch swatch-coral" data-theme="coral" title="Sunset Coral" aria-label="Coral Theme"></button>
                <button class="theme-swatch swatch-purple" data-theme="purple" title="Lavender Calm" aria-label="Purple Theme"></button>
            </div>

            <!-- Auto-Scroll Toggle -->
            <div class="settings-divider"></div>
            <label class="toggle-row">
                <span class="settings-label">Auto-scroll page</span>
                <input type="checkbox" id="autoScrollToggle" checked class="switch-checkbox" aria-label="Toggle Auto-Scroll">
            </label>
        </section>

        <!-- Shortcuts Tip -->
        <div class="shortcuts-tip">
            <span><strong>Shortcuts:</strong> Space: Pause • Esc: Stop • ←/→: Step</span>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>readit</span>
            <span id="versionLabel">v1.0.0</span>
        </footer>
    </main>
</body>

</html>
